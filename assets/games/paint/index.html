<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Colorir</title>
  <link rel="stylesheet" href="../_shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <header id="header"></header>

    <!-- Só para leitores de tela -->
    <p id="status" class="sr-only" role="status"></p>

    <main class="stage board-layout">
      <div id="asker" class="asker">
        <img id="mia" class="mia" src="../_shared/img/mia_happy.svg" alt="" />
      </div>

      <div id="canvas-area" class="board-area canvas-area">
        <!-- No nível das palavras, o desenho da palavra aparece em cima -->
        <img id="picture" class="picture hidden" alt="" />
        <div id="canvas-wrap" class="canvas-wrap" role="img" aria-label="Forma para pintar">
          <canvas id="mask" hidden></canvas>
          <canvas id="base"></canvas>
          <canvas id="paint"></canvas>
          <canvas id="outline"></canvas>
        </div>
      </div>

      <div id="palette-area" class="options-area palette-area">
        <div id="palette" class="options palette" role="radiogroup" aria-label="Cores"></div>
      </div>
    </main>

  </div>
  <script src="../_shared/symbols.js"></script>
  <script src="../_shared/game-utils.js"></script>
  <script src="../_shared/words.js"></script>
  <script src="../_shared/sounds.js"></script>
  <script src="../_shared/bridge.js"></script>
  <script src="../_shared/hold-exit.js"></script>
  <script src="../_shared/kit.js"></script>
  <script src="../_shared/confetti.js"></script>
  <script src="../_shared/result.js"></script>
  <script src="paint-logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
