<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quarto da Mia</title>
  <link rel="stylesheet" href="../_shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <header id="header"></header>

    <!-- Só para leitores de tela -->
    <p id="status" class="sr-only" role="status"></p>

    <main class="room-stage">
      <!-- O quarto: parede, chão e janela são do CSS; os móveis e a Mia entram aqui por cima -->
      <div id="room" class="room" role="group" aria-label="Quarto da Mia">
        <div class="window" aria-hidden="true"></div>
      </div>

      <!-- Os móveis para arrastar, de poucos em poucos (as setas viram a página) -->
      <div id="tray-area" class="tray-area">
        <button id="page-prev" class="icon-btn page-btn" aria-label="Móveis anteriores">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="tray" class="tray" role="group" aria-label="Móveis"></div>
        <button id="page-next" class="icon-btn page-btn" aria-label="Mais móveis">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </main>

  </div>
  <script src="../_shared/sounds.js"></script>
  <script src="../_shared/bridge.js"></script>
  <script src="../_shared/hold-exit.js"></script>
  <script src="../_shared/kit.js"></script>
  <script src="../_shared/drag-logic.js"></script>
  <script src="../_shared/drag.js"></script>
  <script src="room-logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
