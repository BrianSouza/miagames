<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quebra-cabeça</title>
  <link rel="stylesheet" href="../_shared/kit.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <header id="header"></header>

    <!-- Só para leitores de tela -->
    <p id="status" class="sr-only" role="status"></p>

    <main class="stage board-layout puzzle-layout">
      <div id="asker" class="asker" data-mia-stack>
        <img id="mia" class="mia" src="../_shared/img/mia_happy.svg" alt="" />
      </div>

      <div id="board-area" class="board-area">
        <div id="board" class="puzzle-board" role="group" aria-label="Quebra-cabeça"></div>
        <!-- A palavra aparece escrita quando o desenho fica pronto -->
        <p id="word" class="puzzle-word" aria-live="polite"></p>
      </div>

      <div id="tray-area" class="options-area">
        <div id="tray" class="tray" role="group" aria-label="Peças"></div>
      </div>
    </main>

  </div>
  <script src="../_shared/symbols.js"></script>
  <script src="../_shared/game-utils.js"></script>
  <script src="../_shared/words.js"></script>
  <script src="../_shared/sounds.js"></script>
  <script src="../_shared/bridge.js"></script>
  <script src="../_shared/hold-exit.js"></script>
  <script src="../_shared/kit.js"></script>
  <script src="../_shared/confetti.js"></script>
  <script src="../_shared/result.js"></script>
  <script src="../_shared/drag-logic.js"></script>
  <script src="../_shared/drag.js"></script>
  <script src="puzzle-logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
