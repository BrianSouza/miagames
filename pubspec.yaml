name: miagames
description: Educational mini-games for children aged 3–6
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.6
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Subpastas não são incluídas automaticamente: declare cada uma
  assets:
    - assets/images/
    - assets/games/memory/
    - assets/games/_shared/
    - assets/games/_shared/fonts/
