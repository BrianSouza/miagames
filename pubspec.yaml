name: miagames
description: Educational mini-games for children aged 3–6
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.6
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # Subpastas não são incluídas automaticamente: declare cada uma
  assets:
    - assets/images/
    - assets/images/mia/
    - assets/games/memory/
    - assets/games/which-letter/
    - assets/games/_shared/
    - assets/games/_shared/fonts/
    - assets/games/_shared/img/
